[project]
name = "receipts-memory"
version = "0.1.0"
description = "Agent memory with receipts: every remembered fact cites real code, and Relate tells your agent the moment the code moves on."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["relate-db>=1.0.2"]
keywords = ["relate", "neo4j", "graph", "ai-agents", "memory", "claude-code", "mcp", "truth-maintenance"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Developers",
  "Topic :: Software Development",
]

[project.optional-dependencies]
heal = ["anthropic>=0.40"]

[project.scripts]
receipts = "receipts.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/receipts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
